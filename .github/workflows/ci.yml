name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ตรวจช่องโหว่ของ dependency ทุกวันจันทร์ 10:00 น. (เวลาไทย)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ล้มงานเมื่อเจอช่องโหว่ระดับ high ขึ้นไป (moderate/low แค่รายงานไว้ในสรุป)
      - name: Audit production & dev dependencies
        run: npm audit --audit-level=high

      - name: Report full audit to job summary
        if: always()
        run: |
          {
            echo '## npm audit'
            echo
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
