name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # ตรวจช่องโหว่ของ dependency ทุกวันจันทร์ 10:00 น. (เวลาไทย)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ของที่ขึ้น production จริง: ล้มงานตั้งแต่ระดับ high
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      # dev tooling ไม่ถูก deploy และบางครั้งต้นทางยังไม่มีเวอร์ชันแก้ให้
      # (เช่น braces ← micromatch ← fast-glob ← eslint-config-next ที่ช่องโหว่ครอบทุกเวอร์ชัน)
      # จึงล้มงานเฉพาะระดับ critical ส่วนระดับอื่นดูได้ในสรุปของ job
      - name: Audit all dependencies (critical)
        run: npm audit --audit-level=critical

      - name: Report full audit to job summary
        if: always()
        run: |
          {
            echo '## npm audit'
            echo
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
